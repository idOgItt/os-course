cargo-features = ["edition2024"]

[package]
name = "check"
version = "0.1.0"
authors = ["Sergei Fomin <sergio-dna@yandex.ru>"]
edition = "2024"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.11", features = ["blocking", "multipart"] }
structopt = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
glob = "*"