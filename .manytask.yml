deadlines:
  timezone: Europe/Moscow

  deadlines: hard

  schedule:
    - group: syscalls
      start: 2024-09-08 18:00
      steps:
        0.5: 2024-10-03 23:59
      end: 2025-02-01 23:59
      enabled: true
      tasks:
        - task: hello_world
          score: 100
          url: https://gitlab.com/sergey-v-galtsev/nikka-public/-/tree/main/sem/hello_world
          allow_list:
            - sem/hello_world/src/*.rs
          check:
            - cd sem/hello_world && cargo test

        - task: rsh_fork
          score: 100
          url: https://gitlab.com/sergey-v-galtsev/nikka-public/-/blob/main/sem/rsh/README.md
          allow_list: &allow_list_rsh
            - sem/rsh/src/*.rs
          check:
            - cd sem/rsh && cargo test simple

        - task: rsh_file
          score: 100
          url: https://gitlab.com/sergey-v-galtsev/nikka-public/-/blob/main/sem/rsh/README.md#file
          allow_list: *allow_list_rsh
          check:
            - cd sem/rsh && cargo test file

        - task: rsh_pipe
          score: 100
          url: https://gitlab.com/sergey-v-galtsev/nikka-public/-/blob/main/sem/rsh/README.md#pipe
          allow_list: *allow_list_rsh
          check:
            - cd sem/rsh && cargo test pipe

        - task: jobserver
          score: 100
          url: https://gitlab.com/sergey-v-galtsev/nikka-public/-/blob/main/sem/jobserver/README.md
          allow_list:
            - sem/jobserver/src/*.rs
          check:
            - cd sem/jobserver && cargo build && ./test.sh

    - group: lab-1-time
      start: 2024-09-17 18:00
      steps:
        0.5: 2024-12-20 23:59
      end: 2025-02-01 23:59
      enabled: true
      tasks:
        - task: rtc
          is_bonus: true
          score: 100
          url: https://sergey-v-galtsev.gitlab.io/labs-description/lab/book/1-time-1-rtc.html
          check:
            - cd kernel && cargo test --test 1-time-1-rtc
            - cd kernel && cargo test --test 1-time-1-rtc -- -rtc base=2050-12-31T23:59:53
            - cd kernel && cargo test --test 1-time-1-rtc -- -rtc base=2050-01-01T11:59:53

        - task: once-lock
          is_bonus: true
          score: 50
          url: https://sergey-v-galtsev.gitlab.io/labs-description/lab/book/1-time-3-locks-1-once-lock.html
          check:
            - cd ku && cargo test --test 1-time-2-once-lock -- --test-threads=1
            - cd ku && cargo clean
            - cd ku && MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test --test 1-time-2-once-lock

        - task: spinlock
          is_bonus: true
          score: 100
          url: https://sergey-v-galtsev.gitlab.io/labs-description/lab/book/1-time-3-locks-2-spinlock.html
          check:
            - cd ku && cargo test --test 1-time-3-spinlock -- --test-threads=1
            - cd ku && cargo clean
            - cd ku && MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test --test 1-time-3-spinlock

        - task: sequence-lock
          is_bonus: true
          score: 100
          url: https://sergey-v-galtsev.gitlab.io/labs-description/lab/book/1-time-3-locks-3-sequence-lock.html
          check:
            - cd ku && cargo test --test 1-time-4-sequence-lock --test 1-time-4-deadlock -- --test-threads=1
            - cd ku && cargo clean
            - cd ku && MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test --test 1-time-4-sequence-lock

        - task: correlation-point
          is_bonus: true
          score: 100
          url: https://sergey-v-galtsev.gitlab.io/labs-description/lab/book/1-time-4-correlation-point.html
          check:
