            - cd ku && MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test --test 1-time-5-correlation-point
            - cd kernel && cargo test --test 1-time-5-correlation-point

        - task: high-resolution-date
          is_bonus: true
          score: 50
          url: https://sergey-v-galtsev.gitlab.io/labs-description/lab/book/1-time-5-correlation-interval.html
          check:
